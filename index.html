<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D Naming - 可动纸片人</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 舞台容器 -->
    <div id="stage">
        <!-- ================= 基础后层 ================= -->
        <img src="assets/chara/default/hair_back.png" class="layer" id="hair_back" alt="后发">
        <img src="assets/chara/default/body.png" class="layer" id="body" alt="身体">
        <img src="assets/chara/default/skirt.png" class="layer" id="skirt" alt="裙子">
        <img src="assets/chara/default/top.png" class="layer" id="top" alt="上衣">
        
        <!-- ================= 脸部与五官 ================= -->
        <img src="assets/chara/default/face.png" class="layer" id="face" alt="脸型">
        
        <!-- 左眼、右眼（如果你没有单独切图，可以直接指向同一张图，甚至用 CSS 处理） -->
        <img src="assets/chara/default/eye_ball_L.png" class="layer feature-eye" id="eye_ball_L" alt="左眼">
        <img src="assets/chara/default/eye_ball_R.png" class="layer feature-eye" id="eye_ball_R" alt="右眼">
        
        <img src="assets/chara/default/brow_L.png" class="layer feature-brow" id="brow_L" alt="左眉">
        <img src="assets/chara/default/brow_R.png" class="layer feature-brow" id="brow_R" alt="右眉">
        
        <img src="assets/chara/default/mouth.png" class="layer" id="mouth" alt="嘴巴">
        
        <!-- ================= 前发 ================= -->
        <img src="assets/chara/default/hair_front.png" class="layer" id="hair_front" alt="前发">

        <!-- ================= 手臂与动作（通过JS控制） ================= -->
        <!-- 默认显示自然下垂的手臂 -->
        <img src="assets/chara/default/arm_lower_L.png" class="layer arm-layer active" id="arm_lower_L" alt="左手下垂">
        <img src="assets/chara/default/arm_lower_R.png" class="layer arm-layer active" id="arm_lower_R" alt="右手下垂">
        
        <!-- 隐藏的备用动作 -->
        <img src="assets/chara/default/arm_upper_R.png" class="layer arm-layer" id="arm_upper_R" alt="右手扬起">
        <img src="assets/chara/default/arm_lower_R_open.png" class="layer arm-layer" id="arm_lower_R_open" alt="右手张开">
        <img src="assets/chara/default/arm_upper_L_bend.png" class="layer arm-layer" id="arm_upper_L_bend" alt="左手弯曲">
        <img src="assets/chara/default/sleeve_upper_L.png" class="layer arm-layer" id="sleeve_upper_L" alt="左手袖子">
    </div>

    <!-- 控制面板 -->
    <div class="controls">
        <button onclick="setArmAction('default')">默认站立</button>
        <button onclick="setArmAction('wave')">招手 (举右手)</button>
        <button onclick="setArmAction('hands_on_hips')">叉腰 (左手)</button>
        <button onclick="toggleBlink()">开启/关闭眨眼</button>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
